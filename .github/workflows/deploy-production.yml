name: Deploy production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: koc-viet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            front-end/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix back-end

      - name: Install frontend dependencies
        run: npm ci --prefix front-end

      - name: Test backend when available
        run: npm --prefix back-end run test --if-present

      - name: Build backend
        run: npm --prefix back-end run build

      - name: Build frontend
        run: npm --prefix front-end run build

  deploy:
    name: Deploy main to EC2
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/koc_viet_ec2
          chmod 600 ~/.ssh/koc_viet_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='*/.env' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='dist' \
            --exclude='*/dist' \
            -czf /tmp/koc-viet-release.tar.gz .

      - name: Upload application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp \
            -i ~/.ssh/koc_viet_ec2 \
            -o IdentitiesOnly=yes \
            /tmp/koc-viet-release.tar.gz \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/koc-viet-release.tar.gz"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/koc_viet_ec2 \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            -o TCPKeepAlive=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'DEPLOY'
            set -Eeuo pipefail

            release_archive="$HOME/koc-viet-release.tar.gz"
            release_dir="$(mktemp -d)"
            trap 'rm -rf "$release_dir" "$release_archive"' EXIT

            tar -xzf "$release_archive" -C "$release_dir"

            rsync -a --delete \
              --exclude='.env' \
              --exclude='node_modules/' \
              --exclude='dist/' \
              "$release_dir/" /var/www/koc-viet/

            cd /var/www/koc-viet
            docker compose up -d postgres

            npm ci --prefix back-end
            npm ci --prefix front-end

            npm --prefix back-end run build
            npm --prefix front-end run build

            pm2 reload koc-viet-api --update-env
            pm2 save

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 20 \
              --retry-delay 3 \
              --retry-connrefused \
              http://127.0.0.1:3000/health

            sudo nginx -t
            sudo systemctl reload nginx
          DEPLOY