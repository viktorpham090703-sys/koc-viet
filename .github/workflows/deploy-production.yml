name: Deploy production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: koc-viet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            back-end/package-lock.json
            front-end/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix back-end

      - name: Install frontend dependencies
        run: npm ci --prefix front-end

      - name: Test backend when available
        run: npm --prefix back-end run test --if-present

      - name: Build backend
        run: npm --prefix back-end run build

      - name: Build frontend
        run: npm --prefix front-end run build

  deploy:
    name: Deploy main to EC2
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/koc_viet_ec2
          chmod 600 ~/.ssh/koc_viet_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/koc_viet_ec2 \
            -o IdentitiesOnly=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'DEPLOY'
            set -Eeuo pipefail

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 22

            cd /var/www/koc-viet

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            docker compose up -d postgres

            npm ci --prefix back-end
            npm ci --prefix front-end

            npm --prefix back-end run build
            npm --prefix front-end run build

            pm2 reload koc-viet-api --update-env
            pm2 save

            curl \
              --fail \
              --silent \
              --show-error \
              --retry 10 \
              --retry-delay 3 \
              http://127.0.0.1:3000/health

            sudo nginx -t
            sudo systemctl reload nginx
          DEPLOY
